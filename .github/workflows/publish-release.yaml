name: Publish Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release in the format v0.0.0-tetrate-v0'
        required: true
      branch:
        description: 'Branch to release from. Like release-v0.0.x'
        required: true

env:
  GOPROXY: https://proxy.golang.org

jobs:
  # This checks if the kubegres.yaml is up to date.
  # We cannot make the action to update the kubegres.yaml because the release-* branches are protected,
  # and the action would not have the permissions to push the changes.
  check-kubegres-yaml:
    runs-on: ubuntu-latest
    env:
       IMG: tetrate/kubegres:${{ github.event.inputs.version }}
    # The commit that was checked and tagged; the image must be built from the same one.
    outputs:
      sha: ${{ steps.checkout.outputs.sha }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
           ref: ${{ github.event.inputs.branch }}
      - name: Record checked-out commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update kubegres.yaml
        run: make deploy
      - name: Check if there are changes
        run: |
          if ! git diff --exit-code; then
              echo "::error::kubegres.yaml is not up to date. Run 'IMG=${IMG} make deploy' and commit the result."
              exit 1
          fi
      - name: Create the tag
        uses: actions/github-script@v8.0.0
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ github.event.inputs.version }}',
              sha: '${{ steps.checkout.outputs.sha }}'
            })

  # this job builds the docker image and pushes it to docker hub
  docker-hub-push:
    needs: check-kubegres-yaml
    runs-on: ubuntu-latest
    env:
      IMG: tetrate/kubegres:${{ github.event.inputs.version }}
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: ${{ env.PLATFORMS }}
      - uses: docker/setup-buildx-action@v4.0.0
        id: setup-buildx
        with:
          platforms: ${{ env.PLATFORMS }}
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.check-kubegres-yaml.outputs.sha }}
      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
      - name: Login to Docker Hub
        uses: docker/login-action@v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          DOCKER_BUILDER_NAME: ${{ steps.setup-buildx.outputs.name }}
        run: make docker-build-push
