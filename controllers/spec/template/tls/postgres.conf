# Replication configs
listen_addresses = '*'
max_wal_senders = 10
max_connections = 100
shared_buffers = 128MB

# TLS settings
ssl = on
ssl_ca_file = '{{ .RootCertPath }}'
ssl_cert_file = '{{ .CertPath }}'
ssl_key_file = '{{ .KeyPath }}'

